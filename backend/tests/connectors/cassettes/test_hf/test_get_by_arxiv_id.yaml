        Polosukhin\",\"hidden\":false}],\"publishedAt\":\"2017-06-12T17:57:34.000Z\",\"title\":\"Attention
        Is All You Need\",\"summary\":\"The dominant sequence transduction models
        are based on complex recurrent or\\nconvolutional neural networks in an encoder-decoder
        configuration. The best\\nperforming models also connect the encoder and decoder
        through an attention\\nmechanism. We propose a new simple network architecture,
        the Transformer, based\\nsolely on attention mechanisms, dispensing with recurrence
        and convolutions\\nentirely. Experiments on two machine translation tasks
        show these models to be\\nsuperior in quality while being more parallelizable
        and requiring significantly\\nless time to train. Our model achieves 28.4
        BLEU on the WMT 2014\\nEnglish-to-German translation task, improving over
        the existing best results,\\nincluding ensembles by over 2 BLEU. On the WMT
        2014 English-to-French\\ntranslation task, our model establishes a new single-model
        state-of-the-art\\nBLEU score of 41.8 after training for 3.5 days on eight
        GPUs, a small fraction\\nof the training costs of the best models from the
        literature. We show that the\\nTransformer generalizes well to other tasks
        by applying it successfully to\\nEnglish constituency parsing both with large
        and limited training data.\",\"upvotes\":147,\"discussionId\":\"641192343ea54b1aa7e2f084\",\"ai_summary\":\"The
        Transformer architecture, based purely on attention mechanisms, achieves superior
        performance on machine translation and parsing tasks with improved parallelizability
        and reduced training time.\",\"ai_keywords\":[\"recurrent neural networks\",\"convolutional
        neural networks\",\"encoder-decoder configuration\",\"attention mechanism\",\"Transformer\",\"BLEU
