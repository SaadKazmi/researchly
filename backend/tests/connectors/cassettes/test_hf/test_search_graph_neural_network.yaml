        Neural Network based Agent in Google Research Football","summary":"Deep neural
        networks (DNN) can approximate value functions or policies for\nreinforcement
        learning, which makes the reinforcement learning algorithms more\npowerful.
        However, some DNNs, such as convolutional neural networks (CNN),\ncannot extract
        enough information or take too long to obtain enough features\nfrom the inputs
        under specific circumstances of reinforcement learning. For\nexample, the
        input data of Google Research Football, a reinforcement learning\nenvironment
        which trains agents to play football, is the small map of players''\nlocations.
        The information is contained not only in the coordinates of players,\nbut
        also in the relationships between different players. CNNs can neither\nextract
        enough information nor take too long to train. To address this issue,\nthis
        paper proposes a deep q-learning network (DQN) with a graph neural network\n(GNN)
        as its model. The GNN transforms the input data into a graph which better\nrepresents
        the football players'' locations so that it extracts more information\nof
        the interactions between different players. With two GNNs to approximate its\nlocal
        and target value functions, this DQN allows players to learn from their\nexperience
        by using value functions to see the prospective value of each\nintended action.
