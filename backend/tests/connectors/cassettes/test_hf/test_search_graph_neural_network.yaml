        Graph Neural Networks on 2D and 3D Molecular Structures by using Multi-View
        Conditional Information Bottleneck","summary":"Recent pre-training strategies
        for molecular graphs have attempted to use 2D and 3D molecular views as both
        inputs and self-supervised signals, primarily aligning graph-level representations.
        However, existing studies remain limited in addressing two main challenges
        of multi-view molecular learning: (1) discovering shared information between
        two views while diminishing view-specific information and (2) identifying
        and aligning important substructures, e.g., functional groups, which are crucial
        for enhancing cross-view consistency and model expressiveness. To solve these
        challenges, we propose a Multi-View Conditional Information Bottleneck framework,
        called MVCIB, for pre-training graph neural networks on 2D and 3D molecular
        structures in a self-supervised setting. Our idea is to discover the shared
        information while minimizing irrelevant features from each view under the
        MVCIB principle, which uses one view as a contextual condition to guide the
        representation learning of its counterpart. To enhance semantic and structural
        consistency across views, we utilize key substructures, e.g., functional groups
        and ego-networks, as anchors between the two views. Then, we propose a cross-attention
        mechanism that captures fine-grained correlations between the substructures
        to achieve subgraph alignment across views. Extensive experiments in four
        molecular domains demonstrated that MVCIB consistently outperforms baselines
        in both predictive performance and interpretability. Moreover, MVCIB achieved
        the 3d Weisfeiler-Lehman expressiveness power to distinguish not only non-isomorphic
        graphs but also different 3D geometries that share identical 2D connectivity,
        such as isomers.","upvotes":1,"discussionId":"6abb52579e8c2556a1025a15","projectPage":"https://nslab-cuk.github.io/2025/11/22/MVCIB/","githubRepo":"https://github.com/NSLab-CUK/MVCIB","githubRepoAddedBy":"user","ai_summary":"A
