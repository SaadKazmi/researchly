        PubModel=\"Electronic-eCollection\"><Journal><ISSN IssnType=\"Print\">1179-1578</ISSN><JournalIssue
        CitedMedium=\"Print\"><Volume>17</Volume><PubDate><Year>2024</Year></PubDate></JournalIssue><Title>Psychology
        research and behavior management</Title><ISOAbbreviation>Psychol Res Behav
        Manag</ISOAbbreviation></Journal><ArticleTitle>Mitigating Harms of Social
        Media for Adolescent Body Image and Eating Disorders: A Review.</ArticleTitle><Pagination><StartPage>2587</StartPage><EndPage>2601</EndPage><MedlinePgn>2587-2601</MedlinePgn></Pagination><ELocationID
        EIdType=\"doi\" ValidYN=\"Y\">10.2147/PRBM.S410600</ELocationID><Abstract><AbstractText>Social
        media has negative effects on adolescent body image and disordered eating
        behaviors, yet adolescents are unlikely to discontinue engaging with these
        platforms. Thus, it is important to identify strategies that can reduce the
        harms of social media on adolescent mental health. This article reviews research
        on social media and adolescent body image, and discusses strategies to reduce
        risks associated with social media use. Topics covered include interventions
        aimed at mitigating social media's negative impacts, the body-positivity movement,
        and policies regulating adolescents' social media use. Overall, this review
        highlights specific factors (such as staffing, duration, modality, facilitator
        training, and cultural sensitivity) to consider when designing and implementing
        social media interventions targeting adolescents. This review also discusses
        psychosocial outcomes associated with body positivity on social media. Finally,
        policy efforts to reduce the negative impact of social media on adolescents'
        body image and eating behaviors are described. In sum, there is a strong need
        to conduct further research identifying optimal approaches to reduce the harms
        of social media for adolescent body image and eating behavior.</AbstractText><CopyrightInformation>&#xa9;
