        term=\"cs.CV\"/>\n    <author>\n      <name>You Qin</name>\n    </author>\n
        \   <author>\n      <name>Wei Ji</name>\n    </author>\n    <author>\n      <name>Xinze
        Lan</name>\n    </author>\n    <author>\n      <name>Hao Fei</name>\n    </author>\n
        \   <author>\n      <name>Xun Yang</name>\n    </author>\n    <author>\n      <name>Dan
        Guo</name>\n    </author>\n    <author>\n      <name>Roger Zimmermann</name>\n
        \   </author>\n    <author>\n      <name>Lizi Liao</name>\n    </author>\n
