        \ <entry>\n    <id>http://arxiv.org/abs/2512.19700v1</id>\n    <title>\"All
        You Need\" is Not All You Need for a Paper Title: On the Origins of a Scientific
        Meme</title>\n    <updated>2025-12-03T17:36:45Z</updated>\n    <link href=\"https://arxiv.org/abs/2512.19700v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2512.19700v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>The
        2017 paper ''Attention Is All You Need'' introduced the Transformer architecture-and
        inadvertently spawned one of machine learning's most persistent naming conventions.
        We analyze 717 arXiv preprints containing ''All You Need'' in their titles
        (2009-2025), finding exponential growth ($R^2$ &gt; 0.994) following the original
        paper, with 200 titles in 2025 alone. Among papers following the canonical
        ''X [Is] All You Need'' structure, ''Attention'' remains the most frequently
        claimed necessity (28 occurrences). Situating this phenomenon within memetic
        theory, we argue the pattern's success reflects competitive pressures in scientific
        communication that increasingly favor memorability over precision. Whether
        this trend represents harmless academic whimsy or symptomatic sensationalism,
        we leave-with appropriate self-awareness-to the reader.</summary>\n    <category
        term=\"cs.CY\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.DL\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2025-12-03T17:36:45Z</published>\n
        \   <arxiv:primary_category term=\"cs.CY\"/>\n    <author>\n      <name>Anton
        Alyakin</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2112.05993v1</id>\n
        \   <title>Object Counting: You Only Need to Look at One</title>\n    <updated>2021-12-11T14:22:05Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2112.05993v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2112.05993v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>This paper aims to tackle the challenging task
        of one-shot object counting. Given an image containing novel, previously unseen
        category objects, the goal of the task is to count all instances in the desired
        category with only one supporting bounding box example. To this end, we propose
        a counting model by which you only need to Look At One instance (LaoNet).
        First, a feature correlation module combines the Self-Attention and Correlative-Attention
        modules to learn both inner-relations and inter-relations. It enables the
        network to be robust to the inconsistency of rotations and sizes among different
        instances. Second, a Scale Aggregation mechanism is designed to help extract
        features with different scale information. Compared with existing few-shot
        counting methods, LaoNet achieves state-of-the-art results while learning
        with a high convergence speed. The code will be available soon.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2021-12-11T14:22:05Z</published>\n    <arxiv:comment>Keywords:
        Crowd counting, one-shot object counting, Attention</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Hui Lin</name>\n    </author>\n
        \   <author>\n      <name>Xiaopeng Hong</name>\n    </author>\n    <author>\n
        \     <name>Yabin Wang</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2410.05767v2</id>\n
        \   <title>Grounding is All You Need? Dual Temporal Grounding for Video Dialog</title>\n
        \   <updated>2024-11-14T11:27:41Z</updated>\n    <link href=\"https://arxiv.org/abs/2410.05767v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2410.05767v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>In
        the realm of video dialog response generation, the understanding of video
        content and the temporal nuances of conversation history are paramount. While
        a segment of current research leans heavily on large-scale pretrained visual-language
        models and often overlooks temporal dynamics, another delves deep into spatial-temporal
        relationships within videos but demands intricate object trajectory pre-extractions
        and sidelines dialog temporal dynamics. This paper introduces the Dual Temporal
        Grounding-enhanced Video Dialog model (DTGVD), strategically designed to merge
        the strengths of both dominant approaches. It emphasizes dual temporal relationships
        by predicting dialog turn-specific temporal regions, filtering video content
        accordingly, and grounding responses in both video and dialog contexts. One
        standout feature of DTGVD is its heightened attention to chronological interplay.
        By recognizing and acting upon the dependencies between different dialog turns,
        it captures more nuanced conversational dynamics. To further bolster the alignment
        between video and dialog temporal dynamics, we've implemented a list-wise
        contrastive learning strategy. Within this framework, accurately grounded
        turn-clip pairings are designated as positive samples, while less precise
        pairings are categorized as negative. This refined classification is then
        funneled into our holistic end-to-end response generation mechanism. Evaluations
        using AVSD@DSTC-7 and AVSD@DSTC-8 datasets underscore the superiority of our
        methodology.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
