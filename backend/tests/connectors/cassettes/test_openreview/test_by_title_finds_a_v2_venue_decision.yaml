        BY 4.0","number":28,"cdate":1773911104958,"readers":["everyone"],"invitations":["MLSys.org/2026/Conference/-/Submission","MLSys.org/2026/Conference/-/Post_Submission","MLSys.org/2026/Conference/-/Edit","MLSys.org/2026/Conference/Submission28/-/Camera_Ready_Revision"],"mdate":1779237677142,"odate":1779237072381,"domain":"MLSys.org/2026/Conference","id":"7wOOhxkuN8","version":2},{"content":{"venue":{"value":"CoRR
        2023"},"pdf":{"value":"https://arxiv.org/pdf/2305.10449v3"},"venueid":{"value":"OpenReview.net/Public_Article"},"paperhash":{"value":"adeel|cooperation_is_all_you_need"},"html":{"value":"https://doi.org/10.48550/arXiv.2305.10449"},"_bibtex":{"value":"@article{DBLP:journals/corr/abs-2305-10449,\n  publtype={informal},\n  author={Ahsan
        Adeel and Junaid Muzaffar and Khubaib Ahmed and Mohsin Raza},\n  title={Cooperation
        Is All You Need},\n  year={2023},\n  cdate={1672531200000},\n  journal={CoRR},\n  volume={abs/2305.10449},\n  url={https://doi.org/10.48550/arXiv.2305.10449}\n}\n"},"abstract":{"value":"Going
        beyond ''dendritic democracy'', we introduce a ''democracy of local processors'',
        termed Cooperator. Here we compare their capabilities when used in permutation
        invariant neural networks for reinforcement learning (RL), with machine learning
        algorithms based on Transformers, such as ChatGPT. Transformers are based
        on the long standing conception of integrate-and-fire ''point'' neurons, whereas
        Cooperator is inspired by recent neurobiological breakthroughs suggesting
        that the cellular foundations of mental life depend on context-sensitive pyramidal
        neurons in the neocortex which have two functionally distinct points. Weshow
        that when used for RL, an algorithm based on Cooperator learns far quicker
        than that based on Transformer, even while having the same number of parameters."},"title":{"value":"Cooperation
        Is All You Need"},"authors":{"value":[{"fullname":"Ahsan Adeel","username":""},{"fullname":"Junaid
        Muzaffar","username":""},{"fullname":"Khubaib Ahmed","username":"~Khubaib_Ahmed2"},{"fullname":"Mohsin
        Raza","username":""}]}},"tmdate":1793835933133,"pdate":1703980800000,"externalIds":["dblp:journals/corr/abs-2305-10449"],"tcdate":1793835922583,"writers":["~","OpenReview.net/Public_Article/DBLP.org","OpenReview.net/Support"],"signatures":["~Khubaib_Ahmed2"],"forum":"AZ7TLiUP0n","license":"CC
        BY-SA 4.0","number":223438,"cdate":1672531200000,"readers":["everyone"],"invitations":["OpenReview.net/Public_Article/DBLP.org/-/Record","OpenReview.net/Public_Article/-/Edit"],"mdate":1793835933133,"domain":"OpenReview.net/Public_Article","id":"AZ7TLiUP0n","version":2},{"content":{"venue":{"value":"CoRR
        2026"},"pdf":{"value":"https://arxiv.org/pdf/2608.00823v2"},"venueid":{"value":"OpenReview.net/Public_Article"},"paperhash":{"value":"bichuch|freemium_is_all_you_need"},"html":{"value":"https://doi.org/10.48550/arXiv.2608.00823"},"_bibtex":{"value":"@article{DBLP:journals/corr/abs-2608-00823,\n  publtype={informal},\n  author={Maxim
        Bichuch and Aviv Yaish},\n  title={Freemium Is All You Need},\n  year={2026},\n  month={August},\n  cdate={1785542400000},\n  journal={CoRR},\n  volume={abs/2608.00823},\n  url={https://doi.org/10.48550/arXiv.2608.00823}\n}\n"},"abstract":{"value":"Free
        access to a generative AI (GenAI) service requires costly compute, yet can
        also produce data that improve future service quality. We study a service
        provider whose users differ in request value and privacy preference, under
        the constraint that paid requests are kept private, while free requests can
        be used to improve model quality which otherwise reverts toward a baseline.
        In particular, we characterize service demand and prove that quality converges
        to a unique steady state for every stationary service strategy. Next, we analyze
        optimal pricing and quality policies and show that these can be expressed
        using two endogenous user value thresholds. For uniform values, we provide
        a closed-form optimal service strategy and characterize the sufficient conditions
        for offering free services as dependent on inference cost."},"title":{"value":"Freemium
        Is All You Need"},"authors":{"value":[{"fullname":"Maxim Bichuch","username":""},{"fullname":"Aviv
        Yaish","username":"~Aviv_Yaish1"}]}},"tmdate":1790720947120,"pdate":1798675200000,"externalIds":["dblp:journals/corr/abs-2608-00823"],"tcdate":1790720936238,"writers":["~","OpenReview.net/Public_Article/DBLP.org","OpenReview.net/Support"],"signatures":["~Aviv_Yaish1"],"forum":"5uaHgZdarP","license":"CC
        BY-SA 4.0","number":159497,"cdate":1785542400000,"readers":["everyone"],"invitations":["OpenReview.net/Public_Article/DBLP.org/-/Record","OpenReview.net/Public_Article/-/Edit"],"mdate":1790720947120,"domain":"OpenReview.net/Public_Article","id":"5uaHgZdarP","version":2},{"content":{"venue":{"value":"Crossref"},"venueid":{"value":"OpenReview.net/Public_Article"},"paperhash":{"value":"bichuch|freemium_is_all_you_need"},"html":{"value":"https://doi.org/10.2139/ssrn.7217279"},"title":{"value":"Freemium
        is all you need"},"authors":{"value":[{"fullname":"Maxim Bichuch","username":"https://orcid.org/orcid-search/search?searchQuery=Maxim%20Bichuch"},{"fullname":"Aviv
        Yaish","username":"~Aviv_Yaish1"}]}},"tmdate":1790720944631,"pdate":1767225600000,"externalIds":["doi:10.2139/ssrn.7217279"],"tcdate":1790720944495,"writers":["~","OpenReview.net/Public_Article/ORCID.org","OpenReview.net/Support"],"signatures":["~Aviv_Yaish1"],"forum":"zFRVfaXymW","license":"CC
        BY-SA 4.0","number":113245,"cdate":1785761871078,"readers":["everyone"],"invitations":["OpenReview.net/Public_Article/ORCID.org/-/Record","OpenReview.net/Public_Article/-/Edit"],"mdate":1790720944631,"domain":"OpenReview.net/Public_Article","id":"zFRVfaXymW","version":2},{"content":{"venue":{"value":"CoRR
        2024"},"pdf":{"value":"https://arxiv.org/pdf/2406.02021v2"},"venueid":{"value":"OpenReview.net/Public_Article"},"paperhash":{"value":"yun|metamixer_is_all_you_need"},"html":{"value":"https://doi.org/10.48550/arXiv.2406.02021"},"_bibtex":{"value":"@article{DBLP:journals/corr/abs-2406-02021,\n  publtype={informal},\n  author={Seokju
        Yun and Dongheon Lee and Youngmin Ro},\n  title={MetaMixer Is All You Need},\n  year={2024},\n  cdate={1704067200000},\n  journal={CoRR},\n  volume={abs/2406.02021},\n  url={https://doi.org/10.48550/arXiv.2406.02021}\n}\n"},"abstract":{"value":"Transformer,
        composed of self-attention and Feed-Forward Network, has revolutionized the
        landscape of network design across various vision tasks. While self-attention
        is extensively explored as a key factor in performance, FFN has received little
        attention. FFN is a versatile operator seamlessly integrated into nearly all
        AI models to effectively harness rich representations. Recent works also show
        that FFN functions like key-value memories. Thus, akin to the query-key-value
        mechanism within self-attention, FFN can be viewed as a memory network, where
        the input serves as query and the two projection weights operate as keys and
        values, respectively. Based on these observations, we hypothesize that the
        importance lies in query-key-value framework itself for competitive performance.
        To verify this, we propose converting self-attention into a more FFN-like
        efficient token mixer with only convolutions while retaining query-key-value
        framework, namely FFNification. Specifically, FFNification replaces query-key-value
        interactions with large kernel convolutions and adopts GELU activation function
        instead of softmax. The derived token mixer, FFNified attention, serves as
        key-value memories for detecting locally distributed spatial patterns, and
        operates in the opposite dimension to the ConvNeXt block within each corresponding
        sub-operation of the query-key-value framework. Building upon the above two
        modules, we present a family of Fast-Forward Networks (FFNet). Despite being
        composed of only simple operators, FFNet outperforms sophisticated and highly
        specialized methods in each domain, with notable efficiency gains. These results
        validate our hypothesis, leading us to propose MetaMixer, a general mixer
        architecture that does not specify sub-operations within the query-key-value
        framework."},"title":{"value":"MetaMixer Is All You Need"},"authors":{"value":[{"fullname":"Seokju
        Yun","username":""},{"fullname":"Dongheon Lee","username":"~Dongheon_Lee1"},{"fullname":"Youngmin
        Ro","username":""}]}},"tmdate":1779686388719,"pdate":1735603200000,"externalIds":["dblp:journals/corr/abs-2406-02021"],"tcdate":1779686382340,"writers":["~","OpenReview.net/Public_Article/DBLP.org","OpenReview.net/Support"],"signatures":["~Dongheon_Lee3"],"forum":"RLLjTMlFIY","license":"CC
