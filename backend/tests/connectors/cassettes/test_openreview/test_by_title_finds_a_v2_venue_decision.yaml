        Conference on Machine Learning and Systems},\nyear={2026},\nurl={https://openreview.net/forum?id=7wOOhxkuN8}\n}"},"title":{"value":"Dataflow
        Is All You Need"},"authors":{"value":["Darshan Gandhi","Pushkar Nandkar","David
