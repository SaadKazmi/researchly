        style=\"--ltx-fg-color:#FF0000;\">Provided proper attribution is provided,
        Google hereby grants permission to reproduce the tables and figures in this
        paper solely for use in journalistic or scholarly works.</span></p>\n</div>\n<h1
        class=\"ltx_title ltx_title_document\">Attention Is All You Need</h1>\n<div
        class=\"ltx_authors\">\n<span class=\"ltx_creator ltx_role_author\">\n<span
        class=\"ltx_personname\">Ashish Vaswani\n</span><span id=\"id1\" class=\"ltx_note
        ltx_note_frontmatter ltx_thanks_contribution ltx_role_thanks\"><sup class=\"ltx_note_mark\">\u2020</sup><span
        class=\"ltx_note_outer\"><span class=\"ltx_note_content\"><sup class=\"ltx_note_mark\">\u2020</sup><span
        class=\"ltx_note_type\">thanks: </span>Equal contribution. Listing order is
        random. Jakob proposed replacing RNNs with self-attention and started the
        effort to evaluate this idea.\nAshish, with Illia, designed and implemented
        the first Transformer models and has been crucially involved in every aspect
        of this work. Noam proposed scaled dot-product attention, multi-head attention
        and the parameter-free position representation and became the other person
        involved in nearly every detail. Niki designed, implemented, tuned and evaluated
        countless model variants in our original codebase and tensor2tensor. Llion
        also experimented with novel model variants, was responsible for our initial
        codebase, and efficient inference and visualizations. Lukasz and Aidan spent
        countless long days designing various parts of and implementing tensor2tensor,
        replacing our earlier codebase, greatly improving results and massively accelerating
        our research.\n</span></span></span><span class=\"ltx_author_notes\"><span
