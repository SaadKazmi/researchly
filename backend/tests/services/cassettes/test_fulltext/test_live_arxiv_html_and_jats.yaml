        xmlns:xlink=\"http://www.w3.org/1999/xlink\" content-type=\"pmc-pdf\" xlink:href=\"WJR-9-27.pdf\"><?pdf-name
        WJR-9-27.pdf?><?pdf-size 1006134?><?pdf-md5 9c91f19803174073235fe352906e2ab0?><?pdf-image-server-status
        NEVER_LOAD?><?pdf-cloudpmc-urn urn:app:272d/5334499/9c91f1980317/WJR-9-27.pdf?></self-uri><abstract><p>Strategies
        targeting intracellular negative regulators such as immune checkpoint inhibitors
        (ICPIs) have demonstrated significant antitumor activity across a wide range
        of solid tumors. In the clinical practice, the radiological effect of immunotherapeutic
        agents has raised several more relevant and complex challenges for the determination
        of their imaging-based response at single patient level. Accordingly, it has
        been suggested that the conventional Response Evaluation Criteria in Solid
        Tumors assessment alone, based on dimensional evaluation provided by computed
        tomography (CT), tends to underestimate the benefit of ICPIs at least in a
        subset of patients, supporting the need of immune-related response criteria.
        Different from CT, very few data are available for the evaluation of immunotherapy
        by means of <sup>18</sup>F-fluoro-2-deoxy-D-glucose positron emission tomography
        (FDG-PET). Moreover, since the antineoplastic activity of ICPIs is highly
        related to the activation of T cells against cancer cells, FDG accumulation
        might cause false-positive findings. Yet, discrimination between benign and
        malignant processes represents a huge challenge for FDG-PET in this clinical
        setting. Consequently, it might be of high interest to test the complex and
        variegated response to ICPIs by means of PET and thus it is worthwhile to
        ask if a similar introduction of immune-related PET-based criteria could be
        proposed in the future. Finally, PET might offer a new insight into the biology
        and pathophysiology of ICPIs thanks to a growing number of non-invasive immune-diagnostic
        approaches based on non-FDG tracers.</p></abstract><kwd-group><kwd>Immune
        checkpoint inhibitors</kwd><kwd>Positron emission tomography</kwd><kwd>Computed
        tomography</kwd><kwd><sup>18</sup>F-fluoro-2-deoxy-D-glucose</kwd><kwd>Non-<sup>18</sup>F-fluoro-2-deoxy-D-glucose
        tracers</kwd></kwd-group><custom-meta-group><custom-meta><meta-name>pmc-status-qastatus</meta-name><meta-value>0</meta-value></custom-meta><custom-meta><meta-name>pmc-status-live</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-status-embargo</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-status-released</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-open-access</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-olf</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-manuscript</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-legally-suppressed</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-pdf</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-supplement</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-pdf-only</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-suppress-copyright</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-real-version</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-scanned-article</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-preprint</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-in-epmc</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-license-ref</meta-name><meta-value>CC
        BY-NC</meta-value></custom-meta></custom-meta-group></article-meta></front><body><p><bold>Core
        tip:</bold> In the clinical practice, the radiological interpretation of immunotherapy
        effects represents a huge challenge at single patient level. However, although
        the computed tomography-based response evaluation for immune checkpoint inhibitors
        (ICPIs) is feasible thanks to the introduction of immune-related response
        criteria, very few data are available for the potential role of <sup>18</sup>F-fluoro-2-deoxy-D-glucose
        positron emission tomography (FDG-PET). Due to the intrinsic nature of FDG
        accumulation pathophysiology, it might be central to test the complex and
        variegated response to ICPIs by means of PET. Finally, PET might offer a new
        insight into the biology of ICPIs thanks to a growing number of non-invasive
        immune-diagnostic approaches based on non-FDG tracers.</p><sec><title>TEXT</title><p>The
        function of the immune system is characterized by multiple checkpoints aiming
        to avoid its over-activation against healthy cells (self-tolerance)[<xref
        rid=\"B1\" ref-type=\"bibr\">1</xref>]. Cancer cells may take advantage of
        these checkpoints to escape detection by the immune system. Some of these
        checkpoints such as cytotoxic T-lymphocyte-associated antigen 4 (CTLA-4) and
        programmed cell death protein 1 (PD-1) have been extensively studied as targets
        in the frame of the so-called cancer immunotherapy[<xref rid=\"B1\" ref-type=\"bibr\">1</xref>].
        CTLA-4 counteracts the activity of the T cell co-stimulatory receptor CD28
        and actively delivers inhibitory signals to the T cell[<xref rid=\"B2\" ref-type=\"bibr\">2</xref>].
        PD-1 has two ligands, PD1 ligand 1 (PDL1) and PDL2, and its inhibitory effect
        is accomplished through a dual mechanism of promoting apoptosis in antigen
        specific T-cells in lymph nodes while simultaneously reducing apoptosis in
        regulatory T cells (suppressor T cells)[<xref rid=\"B3\" ref-type=\"bibr\">3</xref>].
        In the last few years, the blockade of immune checkpoints has disclosed the
        potential of the antitumor immune response in a fashion that is transforming
        human cancer therapeutics. CTLA4 antibodies such as ipilimumab and tremelimumab
        have been tested in the last ten years in different types of cancer, starting
        with patients with advanced melanoma[<xref rid=\"B4\" ref-type=\"bibr\">4</xref>].
        Ipilimumab was the first therapy to demonstrate a survival benefit for patients
        with metastatic melanoma. In a study by Hodi et al[<xref rid=\"B5\" ref-type=\"bibr\">5</xref>],
        ipilimumab significantly improved overall survival in patients with previously
        treated metastatic melanoma and the drug was approved by the United States
        Food and Drug Administration (FDA) for the treatment of advanced melanoma
        in 2011[<xref rid=\"B5\" ref-type=\"bibr\">5</xref>]. Similarly, nivolumab,
        a humanized anti-PD-1 monoclonal antibody, has demonstrated durable responses
        in several phase III trials and has received FDA approval in specific clinical
        settings in patients with melanoma, renal cell cancer, Hodgkin\u2019s lymphoma,
        bladder cancer, and non-small cell lung cancer (NSCLC)[<xref rid=\"B6\" ref-type=\"bibr\">6</xref>-<xref
        rid=\"B9\" ref-type=\"bibr\">9</xref>]. Figure <xref ref-type=\"fig\" rid=\"F1\">1</xref>
        summarizes the mechanisms of action of the two FDA approved immune checkpoint
        inhibitors (ICPIs).</p><fig id=\"F1\" position=\"float\" orientation=\"portrait\"><label>Figure
        1</label><caption><p>Schematic representation of mechanism of action of nivolumab
        and ipilimumab, two Food and Drug Administration approved immune checkpoint
        inhibitors. To prevent autoimmunity, numerous checkpoint pathways regulate
        the activation of T cells at multiple steps (process known as peripheral tolerance).
        Central in this process are the cytotoxic T-lymphocyte-associated antigen
        4 (CTLA-4) and programmed death 1 (PD-1) immune checkpoints pathways. CTLA-4
        is potentially able to stop autoreactive T cells at the initial stage of naive
        T-cell activation, typically in lymph nodes, while PD-1 regulates previously
        activated T cells at the later stages of an immune response in peripheral
        tissues. The binding between T-cell receptor (TCR), which is expressed on
        T cell surface, with major histocompatibility complex (MHC) expressed on antigen
        presenting cells (APCs) provides specificity to T-cell activation. However,
        T cell activation requires more than one stimulatory signal. Among them a
        central role is played by the binding between B7 molecules (APC) with CD28
        (T-Cell). CTLA-4 is a CD28 homolog which does not produce a stimulatory signal
        but inhibits TCR-MHC binding and thus the T-Cell activation. Different from
        T-cells in which the amount of CTLA-4 is low, T-Regs highly express CTLA-4.
        In these cells CTLA-4 might play a role in their suppressive functions. PD-1
        is a member of the B7/CD38 family of protein, which is able to bind with two
        different ligands: Programmed death ligand 1 (PD-L1) and programmed death
        ligand 2 (PD-L2). PD-1 activation in a T-cell prevents the phosphorylation
        of key TCR signaling intermediates and thus T-cell activation, resulting in
        suboptimal control of infections and cancers. Therefore, even though they
        act at different phases of T-cell activation, the negative effect of PD-1
        and CTLA-4 on T-cell activity is similar. Moreover, different from CTLA-4,
        PD-1 expression is not specific in T-cells, but can be observed also in B-cells
        and myeloid cells. The rationale for immune checkpoint inhibition (represented
        in red) for cancer treatment is that CTLA-4 and PD1 pathways are strictly
        related to cancer survival and thus targeting these molecules or their ligands
        with monoclonal antibodies permits to impact on cancer growth. Therefore,
        even if the exact mechanism of action of these monoclonal antibodies in the
        antitumor response remains unclear, research data suggest that it is at least
        partially related to an activation and proliferation of T-cells regardless
        of TCR specificity (due to the inhibition of the inhibitory activity of these
        checkpoints), which enhances the anti-cancer immune reaction.</p></caption><graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" position=\"float\" orientation=\"portrait\"
        xlink:href=\"WJR-9-27-g001.jpg\"><?image-name WJR-9-27-g001.jpg?><?image-size
        70432?><?image-md5 7df69f88a063a279af1d13630a5d4946?><?image-image-server-status
        NEVER_LOAD?><?image-original-height 544?><?image-original-width 691?><?image-scaled-height
        544?><?image-scaled-width 691?><?image-cloudpmc-urn urn:cdn:blobs/272d/5334499/7df69f88a063/WJR-9-27-g001.jpg?><?thumb-name
        WJR-9-27-g001.gif?><?thumb-size 13391?><?thumb-md5 ebd23adf091a7eaf01e1cbf4815802a7?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 80?><?thumb-scaled-width 101?><?thumb-cloudpmc-urn
        urn:cdn:blobs/272d/5334499/ebd23adf091a/WJR-9-27-g001.gif?></graphic></fig><sec><title>Evaluation
        of response to ICPIs</title><p>Historically, the Response Evaluation Criteria
        in Solid Tumors (RECIST) has been validated and used to evaluate antitumor
        responses to chemotherapeutic agents[<xref rid=\"B10\" ref-type=\"bibr\">10</xref>]
        (Table <xref ref-type=\"table\" rid=\"T1\">1</xref> for a more detailed description).
        These criteria are based on dimensional evaluation and rely on the fact that
        the cytotoxic effect of chemotherapeutic agents tends to translate into measurable
        effects in terms of tumor shrinkage from baseline. Furthermore, published
        studies indicated that achieving a response according to RECIST criteria is
        predictive of remission and improved survival in specific settings[<xref rid=\"B11\"
        ref-type=\"bibr\">11</xref>]. Conversely, both RECIST and their revised 1.1
        version assumed that an early increase in tumor growth and/or the appearance
        of new lesions correspond to progressive disease (PD), testifying drug failure
        and indicating the need of ongoing treatment cessation[<xref rid=\"B10\" ref-type=\"bibr\">10</xref>].</p><table-wrap
        id=\"T1\" position=\"float\" orientation=\"portrait\"><label>Table 1</label><caption><p>Key
        features of positron emission tomography Response Criteria in Solid Tumors,
        European Organization for Research and Treatment of Cancer 1999, Response
        Evaluation Criteria in Solid Tumors 1.1 and immune related Response Criteria</p></caption><table
        frame=\"hsides\" rules=\"groups\"><thead align=\"center\"><tr><td align=\"left\"
        rowspan=\"1\" colspan=\"1\"><bold>Category</bold></td><td rowspan=\"1\" colspan=\"1\"><bold>PERCIST</bold></td><td
        rowspan=\"1\" colspan=\"1\"><bold>EORTC 1999</bold></td><td rowspan=\"1\"
        colspan=\"1\"><bold>RECIST 1.1</bold></td><td rowspan=\"1\" colspan=\"1\"><bold>irRC</bold></td></tr></thead><tbody
        align=\"center\"><tr><td align=\"left\" rowspan=\"1\" colspan=\"1\">Target
        lesions</td><td rowspan=\"1\" colspan=\"1\">The hottest single tumor lesion
        (SUL peak) at baseline <sup>18</sup>F-FDG PET</td><td rowspan=\"1\" colspan=\"1\">The
        most <sup>18</sup>F-FDG-avid lesions (SUV BSA). Number of lesions not specified</td><td
        rowspan=\"1\" colspan=\"1\">Maximum, 5</td><td rowspan=\"1\" colspan=\"1\">Maximum,
        15 lesions</td></tr><tr><td align=\"left\" rowspan=\"1\" colspan=\"1\">New
        lesion</td><td rowspan=\"1\" colspan=\"1\">Results in progressive disease
        at first appearance</td><td rowspan=\"1\" colspan=\"1\">Results in progressive
        disease at first appearance</td><td rowspan=\"1\" colspan=\"1\">Results in
        progressive disease at first appearance</td><td rowspan=\"1\" colspan=\"1\">Up
        to 10 new visceral and 5 cutaneous lesions may be added to the sum of the
        products of the two largest perpendicular diameters of all index lesions at
        any time point</td></tr><tr><td align=\"left\" rowspan=\"1\" colspan=\"1\">Complete
        response</td><td rowspan=\"1\" colspan=\"1\">CMR: Complete resolution of <sup>18</sup>F-FDG
        uptake within the target lesion (&lt; mean liver activity and indistinguishable
        from background/blood pool and no new <sup>18</sup>F-FDG-avid lesions)</td><td
        rowspan=\"1\" colspan=\"1\">CMR: Complete absence of <sup>18</sup>F-FDG uptake</td><td
        colspan=\"2\" rowspan=\"1\">Disappearance of all target and nontarget lesions
        Nodes must regress to &lt; 10 mm short axis No new lesions Confirmation required</td></tr><tr><td
        align=\"left\" rowspan=\"1\" colspan=\"1\">Partial response</td><td rowspan=\"1\"
        colspan=\"1\">PMR: A reduction of a minimum of 30% in the target tumor <sup>18</sup>F-
        FDG SUL peak</td><td rowspan=\"1\" colspan=\"1\">PMR: A decrease in SUV &gt;
        25%</td><td rowspan=\"1\" colspan=\"1\">\u2265 30% decrease in tumor burden
        compared to baseline Confirmation required</td><td rowspan=\"1\" colspan=\"1\">\u2265
        50% decrease in tumor burden compared with baseline<xref ref-type=\"table-fn\"
        rid=\"T1FN1\">1</xref> Confirmation required</td></tr><tr><td align=\"left\"
        rowspan=\"1\" colspan=\"1\">Progressive disease</td><td rowspan=\"1\" colspan=\"1\">PMD:
        A 30% increase in <sup>18</sup>F-FDG SUL peak or advent of new <sup>18</sup>F-FDG-avid
        lesions</td><td rowspan=\"1\" colspan=\"1\">PMD: An increase in SUV &gt; 25%
        or appearance of new lesions</td><td rowspan=\"1\" colspan=\"1\">\u2265 20%
        + 5 mm absolute increase in tumor burden compared with nadir Appearance of
        new lesions or progression of nontarget lesions</td><td rowspan=\"1\" colspan=\"1\">\u2265
        25% increase in tumor burden compared with baseline, nadir or reset baseline<xref
        ref-type=\"table-fn\" rid=\"T1FN1\">1</xref> New lesions added to tumor burden
        Confirmation required</td></tr><tr><td align=\"left\" rowspan=\"1\" colspan=\"1\">Stable
        disease</td><td rowspan=\"1\" colspan=\"1\">SMD: Disease other than CMR, PMR
        or PMD</td><td rowspan=\"1\" colspan=\"1\">SMD: Increase in SUV by &lt; 25%
        or decrease in SUV by &lt; 15%</td><td colspan=\"2\" rowspan=\"1\">Neither
        partial response nor progressive disease</td></tr></tbody></table><table-wrap-foot><fn
        id=\"T1FN1\"><label>1</label><p>If an increase in tumor burden is observed
        at the first scheduled assessment, the baseline is reset to the value observed
        at the first assessment. PERCIST: PET Response Criteria in Solid Tumors; EORTC:
        European Organization for Research and Treatment of Cancer; RECIST: Response
        Evaluation Criteria in Solid Tumors; irRC: Immune related Response Criteria;
        CMR: Complete metabolic response; PMR: Partial metabolic response; PMD: Progressive
        metabolic disease; SMD: Stable metabolic disease; SUL: SUV normalized to lean
        body mass; SUV BSA: SUV normalized for body surface area; SUV: Standardized
        uptake value.</p></fn></table-wrap-foot></table-wrap><p>Some exceptions for
        the use of these criteria have been already suggested in patients treated
        with target therapies such as tyrosine kinase inhibitors as in this group
        of patients the lack of tumor shrinkage in the presence of a stable disease
        has been identified as a potential surrogate end point for improved clinical
        outcome[<xref rid=\"B12\" ref-type=\"bibr\">12</xref>]. However, in the clinical
        practice, the radiological effect of immunotherapeutic agents has raised several
        more relevant and complex challenges for the determination of their imaging-based
        response at single patient level[<xref rid=\"B13\" ref-type=\"bibr\">13</xref>].
        In published studies, while some patients have responded to ICPIs with the
        expected tumor shrinkage (chemo-like response) or with a stable disease (target
        therapy-like response), other distinct immune-related patterns of response
        have been identified. In particular, an initial increase in tumor size, development
        of new lesions and then a delayed objective response were also observed in
        patients treated with immunotherapeutic agents[<xref rid=\"B13\" ref-type=\"bibr\">13</xref>].
        Specifically, in some patients, the initial increase in total tumor burden
        was proven to be due to inflammatory cell infiltrates by means of biopsy.
        In these patients the initial pseudo-progression was followed by a decrease
        in tumor burden or even disease regression.</p><p>As RECIST criteria were
        not suitable to catch these atypical responses, the so-called immune-related
        response criteria (irRC) have been proposed to provide more rigorous characterization
        of all patterns of response observed in the phase II development program for
        ipilimumab in melanoma[<xref rid=\"B13\" ref-type=\"bibr\">13</xref>-<xref
        rid=\"B15\" ref-type=\"bibr\">15</xref>] (Table <xref ref-type=\"table\" rid=\"T1\">1</xref>).
        The main differences between RECIST 1.1 and irRC rely on the fact that, according
        to irRC, appearance of new lesions (PD according to the RECIST criteria) will
        only result in progressive disease in case of a significant (\u2265 25%) increase
        in total tumor burden with respect to baseline. Moreover, different from conventional
        criteria, if irRC-based PD is evident, it requires further confirmation after
        one month with the aim of capturing delayed response.</p><p>Recently, Hodi
        et al[<xref rid=\"B16\" ref-type=\"bibr\">16</xref>] evaluated atypical response
        patterns and reported the overall survival data in correlation with irRC and
        RECIST criteria in the context of a retrospective analysis of 327 melanoma
        patients treated with the PD-1 inhibitor pembrolizumab. This study indicated
        that the conventional RECIST assessment alone tends to underestimate the benefit
        of PD-1 inhibitor therapy in a subset of patients, supporting a need of immune-related
        response evaluation[<xref rid=\"B16\" ref-type=\"bibr\">16</xref>]. IrRC are
        thus increasingly proposed, but they have not been validated yet in the context
        of clinical trials and most trials involving ICPIs continue to use RECIST
        1.1 to obtain standardized endpoints for regulatory approvals[<xref rid=\"B15\"
        ref-type=\"bibr\">15</xref>].</p><p>However, although the irRC seem better
        than RECIST, the former has some limitations. The irRC use the bidimensional
        measurements in line with WHO criteria that are now rarely used in clinical
        trials and replaced by the unidimensional measurement of the larger axis of
        target lesions (RECIST 1.0 and 1.1). The bidimensional measurements introduce
        a greater variability than unidimensional measurements and make it difficult
        to compare the responses with studies using the RECIST criteria.</p></sec><sec><title>Is
        there a role for <sup>18</sup>F-fluoro-2-deoxy-D-glucose positron emission
        tomography in the evaluation of ICPIs?</title><p>While optimal CT-based response
        criteria for ICPIs are in the path of their identification, very few data
        are available for the evaluation of immunotherapy by means of <sup>18</sup>F-fluoro-2-deoxy-D-glucose
        positron emission tomography (<sup>18</sup>F-FDG-PET), one of the most used
        imaging techniques in oncology. <sup>18</sup>F-FDG-PET is currently the most
        widely used molecular imaging modality in the clinical practice for staging
        and restaging of several cancers. <sup>18</sup>F-FDG-PET is clinically indicated
        before and after treatment in patients with Hodgkin\u2019s lymphoma and NSCLC
        and it is used in patients with melanoma for specific clinical indications[<xref
        rid=\"B17\" ref-type=\"bibr\">17</xref>-<xref rid=\"B19\" ref-type=\"bibr\">19</xref>].
        The use of <sup>18</sup>F-FDG-PET in post-treatment settings is based on the
        assumption that tumor size changes are only the final step in a sequence of
        complex metabolic and functional processes during and after treatment[<xref
        rid=\"B20\" ref-type=\"bibr\">20</xref>]. Two different types of criteria
        have been proposed for the identification of <sup>18</sup>F-FDG-PET-based
        response in solid tumors: The European Organization for Research and Treatment
        of Cancer (EORTC) and the PET Response Criteria in Solid Tumors (PERCIST)
        criteria[<xref rid=\"B21\" ref-type=\"bibr\">21</xref>,<xref rid=\"B22\" ref-type=\"bibr\">22</xref>]
        (Table <xref ref-type=\"table\" rid=\"T1\">1</xref>). Both criteria target
        the most metabolically active part of patient\u2019s tumor burden, which is
        regarded as the most viable and aggressive disease site. In both cases, the
        so-called standardized uptake value (SUV) is measured at baseline and after
        treatment. However, they differ for some relevant aspects. The EORTC criteria
        were published in 1999 and are based on the evaluation of a lesion-specific
        region of interest (ROI) chosen as the most <sup>18</sup>F-FDG-avid at baseline
        and followed in the after-treatment scans[<xref rid=\"B22\" ref-type=\"bibr\">22</xref>].
        The PERCIST criteria were proposed in 2009 by Wahl et al[<xref rid=\"B21\"
        ref-type=\"bibr\">21</xref>] and rely on the use of a 1 cm<sup>3</sup> ROI
        on the most <sup>18</sup>F-FDG-avid part of the single most metabolically
        active lesion at each PET/CT scan (which is not necessarily located in the
        same lesion in all scans).</p><p>Relatively few papers have compared the two
        methods in solid tumors and good agreement, similar responses and survival
        outcomes have been highlighted in the available studies[<xref rid=\"B23\"
        ref-type=\"bibr\">23</xref>]. However, for the EORTC criteria, no recommendations
        on the number of target lesions or on whether computing SUV max or average
        SUV for response calculation are given while the PERCIST criteria recommend
        the use of lean body mass for SUV normalization (SUL). In this framework,
        some studies have demonstrated a higher accuracy with respect to RECIST for
        both metabolic response based criteria in patients treated with target therapies
        such as erlotinib. This finding is due to the relative lower tumor shrinkage
        characterizing this type of treatment[<xref rid=\"B24\" ref-type=\"bibr\">24</xref>].
        Similarly, an <sup>18</sup>F-FDG-PET-based five-point scale (5-PS), the so-called
        Deauville criteria, has been demonstrated to be superior to CT-based response
        by scoring images in the assessment of response at the middle and end of treatment
        in HD patients[<xref rid=\"B18\" ref-type=\"bibr\">18</xref>]. Again these
        findings testify that functional changes always precede morphological changes
        in the course of pathological processes. In this regard it might be of interest
        to test the complex and variegated response to ICPIs by means of PET-based
        criteria. In fact, on one hand, functional imaging may capture different features
        of treatment with ICPIs in terms of entity and time course of response. On
        the other hand, it has been reported that the initial increase in tumor size,
        later followed by tumor volume reduction in part of the patients treated with
        ICPIs, is due to inflammatory cell infiltrates. Accordingly, given the well-known
        high metabolic activity characterizing inflammatory cells, this feature may
        also hamper the evaluation of <sup>18</sup>F-FDG-PET-based response to ICPIs.
        Sachpekidis et al[<xref rid=\"B20\" ref-type=\"bibr\">20</xref>] evaluated
        the role of <sup>18</sup>F-FDG-PET/CT after two cycles of ipilimumab in predicting
        the final response to therapy in 22 patients with metastatic melanoma. They
        evaluated response to treatment by means of the EORTC criteria and found that
        <sup>18</sup>F-FDG-PET/CT after two cycles of ipilimumab is predictive of
        the final treatment outcome in patients with progressive metabolic disease
        (PMD) and stable metabolic disease (SMD)[<xref rid=\"B20\" ref-type=\"bibr\">20</xref>].
        However, two patients were initially falsely classified as early SMD, but
        they later demonstrated new metastatic lesions, \u201Cupgrading\u201D them
        to late PMD. Similarly, early evaluation by means of <sup>18</sup>F-FDG-PET
        did not identify responders to treatment as the two patients eventually characterized
        with PMR were initially classified with early PMD due to new lesions[<xref
        rid=\"B20\" ref-type=\"bibr\">20</xref>]. In fact, both RECIST 1.1 and PET-based
        criteria consider the identification of new (metabolically active) lesions
        as progressive disease. Therefore, presently proposed PET-based metabolic
        criteria suffer from at least one of the same limitations that have resulted
        in the underestimation of response to treatment with ICPIs by means of RECIST
        1.1. Similarly, in the phase 2 study by Younes et al[<xref rid=\"B9\" ref-type=\"bibr\">9</xref>],
        nivolumab resulted in frequent responses in patients with classical Hodgkin\u2019s
        lymphoma after failure of ASCT and brentuximab vedotin. Most of these responses
        were maintained through the reported follow-up period with an acceptable safety
        profile. In this study <sup>18</sup>F-FDG-PET was performed at baseline and
        at weeks 17 and 25. A negative <sup>18</sup>F-FDG-PET scan, visually assessed
        by an independent radiological review committee (IRRC), was required for confirmation
        of complete remission. The study demonstrated a general reduction of tumor
        burden. Yet, discordance in complete remission between IRRC and investigator
        assessments was largely based on the interpretation of <sup>18</sup>F-FDG-PET
        scans and standardized uptake values were not collected as part of this study.
        The vast majority of other available data on the potential utility of <sup>18</sup>F-FDG-PET
        after ICPIs are case reports more often describing underlying challenges of
        monitoring radiologic response in these patients and showing <sup>18</sup>F-FDG-PET
        features of inflammatory reactions. PET-highlighted autoimmune pancolitis,
        splenic sarcoidosis-like lesion and exacerbation of sarcoidosis as a potential
        confounder in the assessment of tumor response in a melanoma patient treated
        with ipilimumab have all been described[<xref rid=\"B25\" ref-type=\"bibr\">25</xref>-<xref
        rid=\"B27\" ref-type=\"bibr\">27</xref>]. Similarly, Koo et al[<xref rid=\"B26\"
        ref-type=\"bibr\">26</xref>] illustrated a series of inflammatory reactions
        with avid FDG uptake in patients treated with ipilimumab, including those
        with thyroiditis, hypophysitis, granulomatous inflammation in the lymph nodes
        and skin, and enterocolitis.</p><p>Accordingly, the potential and challenges
        of <sup>18</sup>F-FDG-PET imaging in the evaluation of patients treated with
        ICPIs still need to be clarified and deeply addressed. Given the relatively
        greater experience of CT-based evaluation in this setting and the fact that
        irRC CT-based criteria seem to better in capturing response to ICPIs, it is
        worthwhile to ask if a similar modification of PET-based criteria could be
        proposed in the future.</p></sec><sec><title>Potential new PET-based approaches
        to evaluate the effect of ICPIs</title><p>As mentioned above, due to its intrinsic
        nature, <sup>18</sup>F-FDG-PET displays not only cancer cell\u2019s metabolic
        activity but also inflammation. Since the antineoplastic activity of ICPIs
        is highly related to the activation of T cells against cancer cells, <sup>18</sup>F-FDG
        accumulation might cause false-positive findings. Yet, discrimination between
        benign and malignant processes represents a huge challenge for <sup>18</sup>F-FDG-PET
        in this clinical setting. Together with the need of the clinicians to discriminate
        between responders and non-responders, allowing individual therapy optimization
        and avoiding adverse effects brought about by ineffective therapy, several
        studies have been recently conducted to explore the possible role of non-FDG
        radiotracers in the field of ICPIs. These studies, mainly performed with labeled
        monoclonal antibodies, open the new era of the so-called \u201CImmuno-PET\u201D.
        Accordingly, in 2014, Higashikawa et al[<xref rid=\"B28\" ref-type=\"bibr\">28</xref>]
        developed a molecular imaging probe that is able to evaluate CTLA-4 expression
        prior to CTLA-4 targeting in cancer. This <sup>64</sup>Cu labeled radiotracer
        is basically composed of DOTA protein together with a CTLA-4 specific antibody
        and is able to display CTLA-4 expression <italic toggle=\"yes\">in vivo</italic>.
        Similarly, specific experimental radiotracers were proposed for the visualization
        of PD-1 and PD-L1 cellular expression[<xref rid=\"B29\" ref-type=\"bibr\">29</xref>-<xref
        rid=\"B32\" ref-type=\"bibr\">32</xref>]. Maute et al[<xref rid=\"B29\" ref-type=\"bibr\">29</xref>]
        measured PD-L1 expression by radiolabeling a PD-L1 high affinity protein (HAC)
        with <sup>64</sup>Cu and tested its feasibility in a living mouse, while Hettich
        et al[<xref rid=\"B30\" ref-type=\"bibr\">30</xref>] developed two <sup>64</sup>Cu
        labeled immunoPET tracers for imaging of both PD-1 and PD-L1. Also one SPECT
        study with radiolabeled anti-murine PD-L1 in mice has been conducted[<xref
        rid=\"B32\" ref-type=\"bibr\">32</xref>]. More recently, a <sup>89</sup>Zr
        labeled CD3 PET imaging agent was proposed by Larimer et al[<xref rid=\"B33\"
        ref-type=\"bibr\">33</xref>]. CD3 is a part of the TCR complex that serves
        as a global T lymphocyte marker. By serving as a marker of total T-cell infiltration,
        CD3 may represent a more direct approach than pre-treatment biopsy or genetic
        screening to monitoring tumor immune response, by directly examining active
        recruitment of T cells responsible for cancer cell death. In this study the
        authors showed that CD3 PET imaging revealed two distinct groups of mice,
        stratified by PET signal intensity. While high-CD3 PET uptake was correlated
        with subsequent reduced tumor volume, low uptake was predictive of suboptimal
        response. Altogether these non-invasive approaches allow simultaneous imaging
        of the entire cancer mass and associated metastases, which may differ from
        the primary tumor in CTLA-4, PD-1 or PD-L1 expression status. Immune imaging
        can be used for repeated assessment of the same tumor at different time points
        (<italic toggle=\"yes\">e.g</italic>., before and after treatment), thereby
        yielding a richer set of diagnostic information that would be difficult or
        impossible to achieve with traditional approaches. Furthermore, although further
        investigations are needed before their potential introduction in the clinical
        setting, these non-invasive immune-diagnostic approaches might yield novel
        insights into the biology and pathophysiological importance of ICPIs as cancer
        therapeutics.</p></sec></sec></body><back><fn-group><fn fn-type=\"COI-statement\"><p>Conflict-of-interest
