        ltx_citemacro_cite\">[<a href=\"#bib.bib8\" title=\"\" class=\"ltx_ref\">8</a>]</cite></td>\n<td
        id=\"S6.T4.2.13.2\" class=\"ltx_td ltx_align_center ltx_border_b ltx_border_r\">generative</td>\n<td
        id=\"S6.T4.2.13.3\" class=\"ltx_td ltx_align_center ltx_border_b\">93.3</td></tr>\n</tbody>\n</table>\n</figure>\n<div
        id=\"S6.SS3.p1\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS3.p1.1\" class=\"ltx_p\">To
        evaluate if the Transformer can generalize to other tasks we performed experiments
        on English constituency parsing. This task presents specific challenges: the
        output is subject to strong structural constraints and is significantly longer
        than the input.\nFurthermore, RNN sequence-to-sequence models have not been
        able to attain state-of-the-art results in small-data regimes <cite class=\"ltx_cite
        ltx_citemacro_cite\">[<a href=\"#bib.bib37\" title=\"\" class=\"ltx_ref\">37</a>]</cite>.</p>\n</div>\n<div
        id=\"S6.SS3.p2\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS3.p2.1\" class=\"ltx_p\">We
        trained a 4-layer transformer with <math id=\"S6.SS3.p2.m1\" class=\"ltx_Math\"
        alttext=\"d_{model}=1024\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>d</mi><mrow><mi>m</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>o</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>e</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>l</mi></mrow></msub><mo>=</mo><mn>1024</mn></mrow><annotation
        encoding=\"application/x-tex\">d_{model}=1024</annotation></semantics></math>
        on the Wall Street Journal (WSJ) portion of the Penn Treebank <cite class=\"ltx_cite
        ltx_citemacro_citep\">[<a href=\"#bib.bib25\" title=\"\" class=\"ltx_ref\">25</a>]</cite>,
        about 40K training sentences. We also trained it in a semi-supervised setting,
        using the larger high-confidence and BerkleyParser corpora from with approximately
        17M sentences <cite class=\"ltx_cite ltx_citemacro_citep\">[<a href=\"#bib.bib37\"
        title=\"\" class=\"ltx_ref\">37</a>]</cite>. We used a vocabulary of 16K tokens
        for the WSJ only setting and a vocabulary of 32K tokens for the semi-supervised
        setting.</p>\n</div>\n<div id=\"S6.SS3.p3\" class=\"ltx_para ltx_noindent\">\n<p
        id=\"S6.SS3.p3.1\" class=\"ltx_p\">We performed only a small number of experiments
        to select the dropout, both attention and residual (section\_<a href=\"#S5.SS4\"
        title=\"5.4 Regularization \u2023 5 Training \u2023 Attention Is All You Need\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">5.4</span></a>), learning
        rates and beam size on the Section 22 development set, all other parameters
        remained unchanged from the English-to-German base translation model. During
        inference, we increased the maximum output length to input length + <math
        id=\"S6.SS3.p3.m1\" class=\"ltx_Math\" alttext=\"300\" display=\"inline\"
        intent=\":literal\"><semantics><mn>300</mn><annotation encoding=\"application/x-tex\">300</annotation></semantics></math>.
        We used a beam size of <math id=\"S6.SS3.p3.m2\" class=\"ltx_Math\" alttext=\"21\"
        display=\"inline\" intent=\":literal\"><semantics><mn>21</mn><annotation encoding=\"application/x-tex\">21</annotation></semantics></math>
        and <math id=\"S6.SS3.p3.m3\" class=\"ltx_Math\" alttext=\"\\alpha=0.3\" display=\"inline\"
        intent=\":literal\"><semantics><mrow><mi>\u03B1</mi><mo>=</mo><mn>0.3</mn></mrow><annotation
        encoding=\"application/x-tex\">\\alpha=0.3</annotation></semantics></math>
        for both WSJ only and the semi-supervised setting.</p>\n</div>\n<div id=\"S6.SS3.p4\"
        class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS3.p4.1\" class=\"ltx_p\">Our
        results in Table\_<a href=\"#S6.T4\" title=\"Table 4 \u2023 6.3 English Constituency
        Parsing \u2023 6 Results \u2023 Attention Is All You Need\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">4</span></a> show that despite the lack of
        task-specific tuning our model performs surprisingly well, yielding better
        results than all previously reported models with the exception of the Recurrent
        Neural Network Grammar <cite class=\"ltx_cite ltx_citemacro_cite\">[<a href=\"#bib.bib8\"
        title=\"\" class=\"ltx_ref\">8</a>]</cite>.</p>\n</div>\n<div id=\"S6.SS3.p5\"
        class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS3.p5.1\" class=\"ltx_p\">In
        contrast to RNN sequence-to-sequence models <cite class=\"ltx_cite ltx_citemacro_citep\">[<a
        href=\"#bib.bib37\" title=\"\" class=\"ltx_ref\">37</a>]</cite>, the Transformer
        outperforms the BerkeleyParser <cite class=\"ltx_cite ltx_citemacro_cite\">[<a
        href=\"#bib.bib29\" title=\"\" class=\"ltx_ref\">29</a>]</cite> even when
        training only on the WSJ training set of 40K sentences.</p>\n</div>\n</section>\n</section>\n<section
        id=\"S7\" class=\"ltx_section\">\n<h2 class=\"ltx_title ltx_title_section\"><span
        class=\"ltx_tag ltx_tag_section\">7 </span>Conclusion</h2>\n\n<div id=\"S7.p1\"
        class=\"ltx_para ltx_noindent\">\n<p id=\"S7.p1.1\" class=\"ltx_p\">In this
        work, we presented the Transformer, the first sequence transduction model
        based entirely on attention, replacing the recurrent layers most commonly
        used in encoder-decoder architectures with multi-headed self-attention.</p>\n</div>\n<div
        id=\"S7.p2\" class=\"ltx_para ltx_noindent\">\n<p id=\"S7.p2.1\" class=\"ltx_p\">For
        translation tasks, the Transformer can be trained significantly faster than
        architectures based on recurrent or convolutional layers. On both WMT 2014
        English-to-German and WMT 2014 English-to-French translation tasks, we achieve
        a new state of the art. In the former task our best model outperforms even
        all previously reported ensembles.</p>\n</div>\n<div id=\"S7.p3\" class=\"ltx_para
        ltx_noindent\">\n<p id=\"S7.p3.1\" class=\"ltx_p\">We are excited about the
        future of attention-based models and plan to apply them to other tasks. We
        plan to extend the Transformer to problems involving input and output modalities
        other than text and to investigate local, restricted attention mechanisms
        to efficiently handle large inputs and outputs such as images, audio and video.\nMaking
        generation less sequential is another research goals of ours.</p>\n</div>\n<div
        id=\"S7.p4\" class=\"ltx_para ltx_noindent\">\n<p id=\"S7.p4.1\" class=\"ltx_p\">The
        code we used to train and evaluate our models is available at <a href=\"https://github.com/tensorflow/tensor2tensor\"
        title=\"\" class=\"ltx_ref ltx_url ltx_font_typewriter\">https://github.com/tensorflow/tensor2tensor</a>.</p>\n</div>\n<section
        id=\"S7.SS0.SSS0.Px1\" class=\"ltx_paragraph\">\n<h5 class=\"ltx_title ltx_title_paragraph\">Acknowledgements</h5>\n\n<div
        id=\"S7.SS0.SSS0.Px1.p1\" class=\"ltx_para ltx_noindent\">\n<p id=\"S7.SS0.SSS0.Px1.p1.1\"
        class=\"ltx_p\">We are grateful to Nal Kalchbrenner and Stephan Gouws for\ntheir
        fruitful comments, corrections and inspiration.</p>\n</div>\n</section>\n</section>\n<section
