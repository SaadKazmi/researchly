        class=\"ltx_pagination ltx_role_newpage\"></div>\n<section id=\"Sx1\" class=\"ltx_section\">\n<h2
        class=\"ltx_title ltx_title_section\">Attention Visualizations</h2>\n\n<figure
        id=\"Sx1.F3\" class=\"ltx_figure\"><object type=\"image/svg+xml\" data=\"1706.03762v7/making_more_difficult5_new.svg\"
        id=\"Sx1.F3.g1\" class=\"ltx_graphics ltx_img_landscape\" style=\"aspect-ratio:476/241;\"
        width=\"476\" height=\"241\"></object>\n<figcaption class=\"ltx_caption\"><span
        class=\"ltx_tag ltx_tag_figure\">Figure 3: </span>An example of the attention
        mechanism following long-distance dependencies in the encoder self-attention
        in layer 5 of 6. Many of the attention heads attend to a distant dependency
        of the verb \u2018making\u2019, completing the phrase \u2018making\u2026more
        difficult\u2019. Attentions here shown only for the word \u2018making\u2019.
        Different colors represent different heads. Best viewed in color.</figcaption>\n</figure>\n<figure
        id=\"Sx1.F4\" class=\"ltx_figure\">\n<div class=\"ltx_flex_figure\">\n<div
        class=\"ltx_flex_cell ltx_flex_size_1\"><object type=\"image/svg+xml\" data=\"1706.03762v7/anaphora_resolution_new.svg\"
        id=\"Sx1.F4.g1\" class=\"ltx_graphics ltx_figure_panel ltx_img_landscape\"
        style=\"aspect-ratio:476/254;\" width=\"476\" height=\"254\"></object></div><div
        class=\"ltx_flex_break\"></div><div class=\"ltx_flex_cell ltx_flex_size_1\"><object
        type=\"image/svg+xml\" data=\"1706.03762v7/anaphora_resolution2_new.svg\"
        id=\"Sx1.F4.g2\" class=\"ltx_graphics ltx_figure_panel ltx_img_landscape\"
        style=\"aspect-ratio:476/291;\" width=\"476\" height=\"291\"></object></div></div>\n<figcaption
        class=\"ltx_caption\"><span class=\"ltx_tag ltx_tag_figure\">Figure 4: </span>Two
        attention heads, also in layer 5 of 6, apparently involved in anaphora resolution.
        Top: Full attentions for head 5. Bottom: Isolated attentions from just the
        word \u2018its\u2019 for attention heads 5 and 6. Note that the attentions
        are very sharp for this word.</figcaption>\n</figure>\n<figure id=\"Sx1.F5\"
        class=\"ltx_figure\">\n<div class=\"ltx_flex_figure\">\n<div class=\"ltx_flex_cell
        ltx_flex_size_1\"><object type=\"image/svg+xml\" data=\"1706.03762v7/attending_to_head_new.svg\"
        id=\"Sx1.F5.g1\" class=\"ltx_graphics ltx_figure_panel ltx_img_landscape\"
        style=\"aspect-ratio:476/263;\" width=\"476\" height=\"263\"></object></div><div
        class=\"ltx_flex_break\"></div><div class=\"ltx_flex_cell ltx_flex_size_1\"><object
        type=\"image/svg+xml\" data=\"1706.03762v7/attending_to_head2_new.svg\" id=\"Sx1.F5.g2\"
        class=\"ltx_graphics ltx_figure_panel ltx_img_landscape\" style=\"aspect-ratio:476/256;\"
        width=\"476\" height=\"256\"></object></div></div>\n<figcaption class=\"ltx_caption\"><span
        class=\"ltx_tag ltx_tag_figure\">Figure 5: </span>Many of the attention heads
        exhibit behaviour that seems related to the structure of the sentence. We
        give two such examples above, from two different heads from the encoder self-attention
        at layer 5 of 6. The heads clearly learned to perform different tasks.</figcaption>\n</figure>\n</section>\n</article>\n</div>\n</div>\n<footer
