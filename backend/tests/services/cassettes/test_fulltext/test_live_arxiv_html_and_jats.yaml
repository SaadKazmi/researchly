        id=\"S6.SS2.p1\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS2.p1.1\" class=\"ltx_p\">To
        evaluate the importance of different components of the Transformer, we varied
        our base model in different ways, measuring the change in performance on English-to-German
        translation on the development set, newstest2013. We used beam search as described
        in the previous section, but no checkpoint averaging. We present these results
        in Table\_<a href=\"#S6.T3\" title=\"Table 3 \u2023 6.2 Model Variations \u2023
        6 Results \u2023 Attention Is All You Need\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">3</span></a>.</p>\n</div>\n<div id=\"S6.SS2.p2\" class=\"ltx_para
        ltx_noindent\">\n<p id=\"S6.SS2.p2.1\" class=\"ltx_p\">In Table\_<a href=\"#S6.T3\"
        title=\"Table 3 \u2023 6.2 Model Variations \u2023 6 Results \u2023 Attention
        Is All You Need\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3</span></a>
        rows (A), we vary the number of attention heads and the attention key and
        value dimensions, keeping the amount of computation constant, as described
        in Section <a href=\"#S3.SS2.SSS2\" title=\"3.2.2 Multi-Head Attention \u2023
        3.2 Attention \u2023 3 Model Architecture \u2023 Attention Is All You Need\"
        class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3.2.2</span></a>. While
        single-head attention is 0.9 BLEU worse than the best setting, quality also
        drops off with too many heads.</p>\n</div>\n<div id=\"S6.SS2.p3\" class=\"ltx_para
        ltx_noindent\">\n<p id=\"S6.SS2.p3.1\" class=\"ltx_p\">In Table\_<a href=\"#S6.T3\"
        title=\"Table 3 \u2023 6.2 Model Variations \u2023 6 Results \u2023 Attention
        Is All You Need\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3</span></a>
        rows (B), we observe that reducing the attention key size <math id=\"S6.SS2.p3.m1\"
        class=\"ltx_Math\" alttext=\"d_{k}\" display=\"inline\" intent=\":literal\"><semantics><msub><mi>d</mi><mi>k</mi></msub><annotation
        encoding=\"application/x-tex\">d_{k}</annotation></semantics></math> hurts
        model quality. This suggests that determining compatibility is not easy and
        that a more sophisticated compatibility function than dot product may be beneficial.
        We further observe in rows (C) and (D) that, as expected, bigger models are
        better, and dropout is very helpful in avoiding over-fitting. In row (E) we
        replace our sinusoidal positional encoding with learned positional embeddings
        <cite class=\"ltx_cite ltx_citemacro_citep\">[<a href=\"#bib.bib9\" title=\"\"
        class=\"ltx_ref\">9</a>]</cite>, and observe nearly identical results to the
        base model.</p>\n</div>\n</section>\n<section id=\"S6.SS3\" class=\"ltx_subsection\">\n<h3
