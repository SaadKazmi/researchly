        id=\"S6.SS1.p1\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS1.p1.1\" class=\"ltx_p\">On
        the WMT 2014 English-to-German translation task, the big transformer model
        (Transformer (big) in Table\_<a href=\"#S6.T2\" title=\"Table 2 \u2023 6.1
        Machine Translation \u2023 6 Results \u2023 Attention Is All You Need\" class=\"ltx_ref\"><span
        class=\"ltx_text ltx_ref_tag\">2</span></a>) outperforms the best previously
        reported models (including ensembles) by more than <math id=\"S6.SS1.p1.m1\"
        class=\"ltx_Math\" alttext=\"2.0\" display=\"inline\" intent=\":literal\"><semantics><mn>2.0</mn><annotation
        encoding=\"application/x-tex\">2.0</annotation></semantics></math> BLEU, establishing
        a new state-of-the-art BLEU score of <math id=\"S6.SS1.p1.m2\" class=\"ltx_Math\"
        alttext=\"28.4\" display=\"inline\" intent=\":literal\"><semantics><mn>28.4</mn><annotation
        encoding=\"application/x-tex\">28.4</annotation></semantics></math>. The configuration
        of this model is listed in the bottom line of Table\_<a href=\"#S6.T3\" title=\"Table
        3 \u2023 6.2 Model Variations \u2023 6 Results \u2023 Attention Is All You
        Need\" class=\"ltx_ref\"><span class=\"ltx_text ltx_ref_tag\">3</span></a>.
        Training took <math id=\"S6.SS1.p1.m3\" class=\"ltx_Math\" alttext=\"3.5\"
        display=\"inline\" intent=\":literal\"><semantics><mn>3.5</mn><annotation
        encoding=\"application/x-tex\">3.5</annotation></semantics></math> days on
        <math id=\"S6.SS1.p1.m4\" class=\"ltx_Math\" alttext=\"8\" display=\"inline\"
        intent=\":literal\"><semantics><mn>8</mn><annotation encoding=\"application/x-tex\">8</annotation></semantics></math>
        P100 GPUs. Even our base model surpasses all previously published models and
        ensembles, at a fraction of the training cost of any of the competitive models.</p>\n</div>\n<div
        id=\"S6.SS1.p2\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS1.p2.1\" class=\"ltx_p\">On
        the WMT 2014 English-to-French translation task, our big model achieves a
        BLEU score of <math id=\"S6.SS1.p2.m1\" class=\"ltx_Math\" alttext=\"41.0\"
        display=\"inline\" intent=\":literal\"><semantics><mn>41.0</mn><annotation
        encoding=\"application/x-tex\">41.0</annotation></semantics></math>, outperforming
        all of the previously published single models, at less than <math id=\"S6.SS1.p2.m2\"
        class=\"ltx_Math\" alttext=\"1/4\" display=\"inline\" intent=\":literal\"><semantics><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow><annotation
        encoding=\"application/x-tex\">1/4</annotation></semantics></math> the training
        cost of the previous state-of-the-art model. The Transformer (big) model trained
        for English-to-French used dropout rate <math id=\"S6.SS1.p2.m3\" class=\"ltx_Math\"
        alttext=\"P_{drop}=0.1\" display=\"inline\" intent=\":literal\"><semantics><mrow><msub><mi>P</mi><mrow><mi>d</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>r</mi><mo lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>o</mi><mo
        lspace=\"0em\" rspace=\"0em\">\u200B</mo><mi>p</mi></mrow></msub><mo>=</mo><mn>0.1</mn></mrow><annotation
        encoding=\"application/x-tex\">P_{drop}=0.1</annotation></semantics></math>,
        instead of <math id=\"S6.SS1.p2.m4\" class=\"ltx_Math\" alttext=\"0.3\" display=\"inline\"
        intent=\":literal\"><semantics><mn>0.3</mn><annotation encoding=\"application/x-tex\">0.3</annotation></semantics></math>.</p>\n</div>\n<div
        id=\"S6.SS1.p3\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS1.p3.1\" class=\"ltx_p\">For
        the base models, we used a single model obtained by averaging the last 5 checkpoints,
        which were written at 10-minute intervals. For the big models, we averaged
        the last 20 checkpoints. We used beam search with a beam size of <math id=\"S6.SS1.p3.m1\"
        class=\"ltx_Math\" alttext=\"4\" display=\"inline\" intent=\":literal\"><semantics><mn>4</mn><annotation
        encoding=\"application/x-tex\">4</annotation></semantics></math> and length
        penalty <math id=\"S6.SS1.p3.m2\" class=\"ltx_Math\" alttext=\"\\alpha=0.6\"
        display=\"inline\" intent=\":literal\"><semantics><mrow><mi>\u03B1</mi><mo>=</mo><mn>0.6</mn></mrow><annotation
        encoding=\"application/x-tex\">\\alpha=0.6</annotation></semantics></math>
        <cite class=\"ltx_cite ltx_citemacro_citep\">[<a href=\"#bib.bib38\" title=\"\"
        class=\"ltx_ref\">38</a>]</cite>. These hyperparameters were chosen after
        experimentation on the development set. We set the maximum output length during
        inference to input length + <math id=\"S6.SS1.p3.m3\" class=\"ltx_Math\" alttext=\"50\"
        display=\"inline\" intent=\":literal\"><semantics><mn>50</mn><annotation encoding=\"application/x-tex\">50</annotation></semantics></math>,
        but terminate early when possible <cite class=\"ltx_cite ltx_citemacro_citep\">[<a
        href=\"#bib.bib38\" title=\"\" class=\"ltx_ref\">38</a>]</cite>.</p>\n</div>\n<div
        id=\"S6.SS1.p4\" class=\"ltx_para ltx_noindent\">\n<p id=\"S6.SS1.p4.1\" class=\"ltx_p\">Table
        <a href=\"#S6.T2\" title=\"Table 2 \u2023 6.1 Machine Translation \u2023 6
        Results \u2023 Attention Is All You Need\" class=\"ltx_ref\"><span class=\"ltx_text
        ltx_ref_tag\">2</span></a> summarizes our results and compares our translation
        quality and training costs to other model architectures from the literature.
        We estimate the number of floating point operations used to train a model
        by multiplying the training time, the number of GPUs used, and an estimate
        of the sustained single-precision floating-point capacity of each GPU <span
        id=\"footnote2\" class=\"ltx_note ltx_role_footnote\"><sup class=\"ltx_note_mark\">2</sup><span
        class=\"ltx_note_outer\"><span class=\"ltx_note_content\"><sup class=\"ltx_note_mark\">2</sup>\n
        \             <span class=\"ltx_tag ltx_tag_note\">2</span>\n              \n
        \             \n              \n            We used values of 2.8, 3.7, 6.0
        and 9.5 TFLOPS for K80, K40, M40 and P100, respectively.</span></span></span>.</p>\n</div>\n</section>\n<section
        id=\"S6.SS2\" class=\"ltx_subsection\">\n<h3 class=\"ltx_title ltx_title_subsection\"><span
