[project]
name = "researchly"
version = "0.0.0"
description = "Local-first multi-agent research assistant"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "protego==0.7.0",  # robots.txt (RFC 9309) for full-text fetches
  "fastapi>=0.120",
  "uvicorn>=0.40",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "keyring>=25.6",
  "cryptography>=46",
  "pyyaml>=6.0.2",
  "litellm==1.105.1",
  "deepagents==0.7.32",
  "langchain==1.4.7",
  "langchain-core==1.7.3",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg-pool>=3.2",
  "langchain-litellm==0.11.1",
  "deno==2.9.8",  # Deno runtime as a wheel: light code cells (ADR 0006)
  "fastembed==0.9.1",  # ONNX embedder + reranker on CPU, no torch (ADR 0007)
  "semchunk==4.1.1",  # sentence-aware chunking with any token counter (MIT)
  # PDF text, layout and OCR on onnxruntime; pypdfium2 because docling-parse 7.x has no Intel-Mac wheel (ADR 0005)
  "docling-slim[format-pdf-pypdfium2,convert-core,feat-ocr-rapidocr-onnx]==2.142.1",
  "transformers>=4.50,<5",  # Heron image processor; 5.x refuses it without torchvision
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",  # last Intel-Mac wheel
  "onnxruntime>=1.23; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "httpx==0.28.1",  # PoliteClient's guarded transport replaces a private attribute (connectors/ssrf.py)
  "httpcore==1.0.9",
  "pgvector==0.5.1",  # halfvec columns and binds (MIT)
  "defusedxml>=0.7.1",  # untrusted XML (arXiv, PubMed)
  "lxml==6.1.3",  # arXiv LaTeXML HTML (already locked via docling)
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "vcrpy==9.2.0",
  "pytest-recording==0.14.0",
  "testcontainers[postgres]>=4.10",
  "ruff>=0.14",
  "pyright>=1.1.405",
  "claude-agent-sdk==0.2.169",  # dev-only claude-code provider (spec §7.7); never a runtime dependency
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchly"]
artifacts = ["src/researchly/web/**"]  # the built SPA is gitignored, but it ships in the wheel
exclude = ["src/researchly/llm/dev"]  # spec §7.7: the dev provider is excluded from release builds

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { litellm = "14 days" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not platform and not nightly'"
markers = [
  "db: needs Postgres 18 + pgvector",
  "live: calls a real model; opt-in, never in CI",
  "platform: downloads real models or runtimes; runs in the CI platform job (all five OS)",
  "nightly: calls real keyless scholarly APIs; runs in the nightly workflow",
]
